```html
<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Мировые субъекты | Федерация Республик Аякса</title>

<link rel="icon" type="image/x-icon" href="../favicon.ico">

<link rel="stylesheet" href="../style.css">


<style>

/* =========================
   МИРОВОЙ РЕЕСТР
========================= */

#worlds-content {

    font-size: 18px;

    line-height: 1.7;

}


/* =========================
   ЗАГОЛОВОК
========================= */

#worlds-content h1 {

    font-size: 34px;

    margin-bottom: 10px;

    line-height: 1.3;

    text-align: center;

}


/* =========================
   ОПИСАНИЕ
========================= */

.worlds-description {

    font-size: 18px;

    margin-bottom: 35px;

    opacity: 0.85;

    text-align: center;

}


/* =========================
   НАВИГАЦИЯ
========================= */

.worlds-navigation {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    margin-bottom: 30px;

}


.worlds-navigation a {

    display: inline-block;

    padding: 10px 18px;

    border: 1px solid
    rgba(45, 140, 255, 0.7);

    border-radius: 8px;

    background:
    rgba(20, 50, 95, 0.45);

    color:
    rgba(150, 210, 255, 0.95);

    text-decoration: none;

    font-size: 14px;

    letter-spacing: 0.5px;

    transition: 0.25s ease;

}


.worlds-navigation a:hover {

    background:
    rgba(35, 100, 180, 0.5);

    border-color:
    rgba(90, 180, 255, 1);

    box-shadow:
    0 0 12px
    rgba(30, 130, 255, 0.25);

}


/* =========================
   ЗАГОЛОВКИ КОЛОНОК
========================= */

.worlds-header {

    display: grid;

    grid-template-columns:

    2fr
    1.4fr
    1.4fr
    1.2fr
    60px;

    align-items: center;

    gap: 25px;

    padding:

    0 24px 8px 24px;

}


.world-header-label {

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    color:

    rgba(120, 190, 255, 0.65);

}


.world-header-label:last-child {

    text-align: center;

}


/* =========================
   СПИСОК СУБЪЕКТОВ
========================= */

.worlds-list {

    display: flex;

    flex-direction: column;

    gap: 15px;

}


/* =========================
   СТРОКА СУБЪЕКТА
========================= */

.world-row {

    display: grid;

    grid-template-columns:

    2fr
    1.4fr
    1.4fr
    1.2fr
    60px;

    align-items: center;

    gap: 25px;

    width: 100%;

    box-sizing: border-box;

    padding: 20px 24px;

    background:

    linear-gradient(

        145deg,

        rgba(20, 40, 75, 0.85),

        rgba(8, 18, 38, 0.95)

    );

    border:

    1px solid

    rgba(45, 140, 255, 0.45);

    border-radius: 12px;

    color: inherit;

    transition:

    transform 0.25s ease,

    box-shadow 0.25s ease,

    border-color 0.25s ease;

}


/* =========================
   НАВЕДЕНИЕ
========================= */

.world-row:hover {

    transform:

    translateY(-3px);

    border-color:

    rgba(80, 170, 255, 0.9);

    box-shadow:

    0 0 18px

    rgba(30, 130, 255, 0.25);

}


/* =========================
   ФЛАГ + НАЗВАНИЕ
========================= */

.world-name-container {

    display: flex;

    align-items: center;

    gap: 15px;

}


.world-flag {

    width: 58px;

    height: 38px;

    object-fit: cover;

    flex-shrink: 0;

    border-radius: 5px;

    border:

    1px solid

    rgba(100, 180, 255, 0.6);

    box-shadow:

    0 0 8px

    rgba(30, 120, 255, 0.2);

}


.world-name {

    font-size: 20px;

    font-weight: 600;

    line-height: 1.3;

}


.world-id {

    margin-top: 5px;

    font-size: 11px;

    letter-spacing: 1.5px;

    color:

    rgba(120, 190, 255, 0.7);

}


/* =========================
   ЗНАЧЕНИЯ
========================= */

.world-value {

    font-size: 15px;

    color:

    rgba(235, 245, 255, 0.9);

}


/* =========================
   РАССТОЯНИЕ
========================= */

.world-distance {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    font-size: 15px;

    color:

    rgba(235, 245, 255, 0.9);

}


.distance-symbol {

    font-size: 12px;

    color:

    rgba(120, 190, 255, 0.75);

    cursor: help;

}


/* =========================
   ТИП СУБЪЕКТА
========================= */

.world-type {

    font-size: 15px;

    color:

    rgba(170, 220, 255, 0.95);

}


/* =========================
   УРОВЕНЬ LVS
========================= */

.world-access {

    font-size: 15px;

    font-weight: 600;

    color:

    rgba(150, 210, 255, 0.95);

}


/* =========================
   СТРЕЛКА
========================= */

.world-dossier-button {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 42px;

    height: 42px;

    box-sizing: border-box;

    border:

    1px solid

    rgba(80, 170, 255, 0.7);

    border-radius: 8px;

    background:

    rgba(20, 60, 110, 0.35);

    color:

    rgba(160, 220, 255, 0.95);

    font-size: 22px;

    cursor: pointer;

    transition:

    background 0.25s ease,

    border-color 0.25s ease,

    box-shadow 0.25s ease,

    transform 0.25s ease;

}


.world-dossier-button:hover {

    background:

    rgba(35, 100, 180, 0.55);

    border-color:

    rgba(100, 190, 255, 1);

    box-shadow:

    0 0 12px

    rgba(30, 130, 255, 0.35);

    transform:

    translateX(2px);

}


/* =========================
   АДАПТИВНОСТЬ
========================= */

@media (max-width: 900px) {

    .worlds-header {

        display: none;

    }


    .world-row {

        grid-template-columns:

        1fr 1fr;

    }

}


@media (max-width: 600px) {

    .world-row {

        grid-template-columns: 1fr;

        gap: 15px;

    }


    #worlds-content h1 {

        font-size: 28px;

    }

}

</style>

</head>


<body>


<div class="container">


<div class="content" id="worlds-content">

     НАВИГАЦИЯ
========================= -->

</div>

class="worlds-list"
id="worlds-list"
>

</div>


</div>

========================= -->

<script src="worlds/worlds.js"></script>


</body>

</html>
```
