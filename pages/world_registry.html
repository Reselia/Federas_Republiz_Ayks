<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Мировые субъекты | Федерация Республик Аякса</title>

<link rel="icon" type="image/x-icon" href="../favicon.ico">

<link rel="stylesheet" href="../style.css">

<style>

/* =========================
   МИРОВОЙ РЕЕСТР
========================= */

#worlds-content {

    font-size: 18px;

    line-height: 1.7;

}


/* =========================
   ЗАГОЛОВОК
========================= */

#worlds-content h1 {

    font-size: 34px;

    margin-bottom: 10px;

    line-height: 1.3;

    text-align: center;

}


/* =========================
   ОПИСАНИЕ
========================= */

.worlds-description {

    font-size: 18px;

    margin-bottom: 35px;

    opacity: 0.85;

    text-align: center;

}


/* =========================
   НАВИГАЦИЯ
========================= */

.worlds-navigation {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    margin-bottom: 30px;

}


.worlds-navigation a {

    display: inline-block;

    padding: 10px 18px;

    border: 1px solid
    rgba(45, 140, 255, 0.7);

    border-radius: 8px;

    background:
    rgba(20, 50, 95, 0.45);

    color:
    rgba(150, 210, 255, 0.95);

    text-decoration: none;

    font-size: 14px;

    letter-spacing: 0.5px;

    transition:

    background 0.25s ease,

    border-color 0.25s ease,

    box-shadow 0.25s ease;

}


.worlds-navigation a:hover {

    background:
    rgba(35, 100, 180, 0.5);

    border-color:
    rgba(90, 180, 255, 1);

    box-shadow:
    0 0 12px
    rgba(30, 130, 255, 0.25);

}


/* =========================
   СПИСОК
========================= */

.worlds-list {

    display: flex;

    flex-direction: column;

    gap: 15px;

    width: 100%;

}


/* =========================
   СТРОКА СУБЪЕКТА
========================= */

.world-row {

    display: grid;

    grid-template-columns:
    minmax(260px, 2.2fr)
    minmax(150px, 1.2fr)
    minmax(170px, 1.3fr)
    minmax(100px, 0.8fr)
    60px;

    align-items: center;

    gap: 25px;

    width: 100%;

    box-sizing: border-box;

    padding: 20px 24px;

    background:

    linear-gradient(

        145deg,

        rgba(20, 40, 75, 0.85),

        rgba(8, 18, 38, 0.95)

    );

    border:

    1px solid

    rgba(45, 140, 255, 0.45);

    border-radius: 12px;

    color: inherit;

    transition:

    transform 0.25s ease,

    box-shadow 0.25s ease,

    border-color 0.25s ease;

}


/* =========================
   НАВЕДЕНИЕ
========================= */

.world-row:hover {

    transform:
    translateY(-3px);

    border-color:
    rgba(80, 170, 255, 0.9);

    box-shadow:

    0 0 18px
    rgba(30, 130, 255, 0.25);

}


/* =========================
   ФЛАГ + НАЗВАНИЕ
========================= */

.world-name-container {

    display: flex;

    align-items: center;

    gap: 15px;

    min-width: 0;

}


.world-flag {

    width: 58px;

    height: 38px;

    object-fit: cover;

    flex-shrink: 0;

    border-radius: 5px;

    border:

    1px solid

    rgba(100, 180, 255, 0.6);

    box-shadow:

    0 0 8px
    rgba(30, 120, 255, 0.2);

}


.world-name {

    font-size: 20px;

    font-weight: 600;

    line-height: 1.3;

}


.world-id {

    margin-top: 5px;

    font-size: 11px;

    letter-spacing: 1.5px;

    color:

    rgba(120, 190, 255, 0.7);

}


/* =========================
   ТЕРМИНЫ
========================= */

.world-label {

    display: block;

    margin-bottom: 4px;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    color:

    rgba(120, 190, 255, 0.65);

    cursor: help;

}


/* =========================
   ЗНАЧЕНИЯ
========================= */

.world-value {

    font-size: 15px;

    color:

    rgba(235, 245, 255, 0.9);

}


/* =========================
   ТИП СУБЪЕКТА
========================= */

.world-type {

    font-size: 15px;

    color:

    rgba(170, 220, 255, 0.95);

}


/* =========================
   LVS
========================= */

.world-access {

    font-size: 15px;

    font-weight: 600;

    color:

    rgba(150, 210, 255, 0.95);

}


/* =========================
   РАССТОЯНИЕ
========================= */

.world-distance {

    font-size: 15px;

    color:

    rgba(235, 245, 255, 0.9);

    white-space: nowrap;

}


/* =========================
   СТРЕЛКА
========================= */

.world-dossier-button {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 42px;

    height: 42px;

    box-sizing: border-box;

    border:

    1px solid

    rgba(80, 170, 255, 0.7);

    border-radius: 8px;

    background:

    rgba(20, 60, 110, 0.35);

    color:

    rgba(160, 220, 255, 0.95);

    font-size: 22px;

    text-decoration: none;

    cursor: pointer;

    transition:

    background 0.25s ease,

    border-color 0.25s ease,

    box-shadow 0.25s ease,

    transform 0.25s ease;

}


.world-dossier-button:hover {

    background:

    rgba(35, 100, 180, 0.55);

    border-color:

    rgba(100, 190, 255, 1);

    box-shadow:

    0 0 12px

    rgba(30, 130, 255, 0.35);

    transform:

    translateX(2px);

}


/* =========================
   ПОДСКАЗКИ ТЕРМИНОВ
========================= */

.world-label[data-tooltip] {

    position: relative;

}


.world-label[data-tooltip]::after {

    content: attr(data-tooltip);

    position: absolute;

    left: 0;

    bottom: calc(100% + 8px);

    width: max-content;

    max-width: 300px;

    padding: 8px 12px;

    border-radius: 7px;

    background:

    rgba(8, 20, 40, 0.97);

    border:

    1px solid

    rgba(70, 160, 255, 0.55);

    color:

    rgba(225, 240, 255, 0.95);

    font-size: 12px;

    line-height: 1.4;

    letter-spacing: 0;

    text-transform: none;

    white-space: normal;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transform:
    translateY(4px);

    transition:

    opacity 0.2s ease,

    transform 0.2s ease,

    visibility 0.2s ease;

    z-index: 20;

    box-shadow:

    0 0 15px

    rgba(20, 120, 255, 0.2);

}


.world-label[data-tooltip]:hover::after {

    opacity: 1;

    visibility: visible;

    transform:
    translateY(0);

}


/* =========================
   АДАПТИВНОСТЬ
========================= */

@media (max-width: 1000px) {

    .world-row {

        grid-template-columns:

        1.7fr
        1fr
        1fr
        0.8fr
        55px;

        gap: 15px;

        padding: 18px;

    }

}


@media (max-width: 800px) {

    .world-row {

        grid-template-columns:

        1fr
        1fr
        1fr;

    }


    .world-dossier-button {

        grid-column: 3;

        grid-row: 1 / span 2;

    }

}


@media (max-width: 600px) {

    .world-row {

        grid-template-columns: 1fr;

        gap: 15px;

    }


    .world-dossier-button {

        grid-column: auto;

        grid-row: auto;

        justify-self: end;

    }


    #worlds-content h1 {

        font-size: 28px;

    }


    .world-name-container {

        align-items: flex-start;

    }

}

</style>

</head>
