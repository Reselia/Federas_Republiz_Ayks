<script>


function loadIncident(incident) {


fetch("incidents/" + incident)


.then(response => {


if (!response.ok) {

throw new Error("Ошибка загрузки");

}


return response.text();


})


.then(data => {


document.getElementById("incident-content").innerHTML = data;


})


.catch(error => {


document.getElementById("incident-content").innerHTML =

"<h2>Ошибка загрузки инцидента</h2>" +

"<p>Не удалось загрузить данные.</p>";


});


}


</script>
