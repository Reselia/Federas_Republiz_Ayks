<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Персонажи | Федерация Республик Аякса</title>

<link rel="icon" type="image/x-icon" href="../favicon.ico">

<link rel="stylesheet" href="../style.css">

<style>

/* =========================
   БАЗА ДАННЫХ ПЕРСОНАЖЕЙ
========================= */

#characters-content {

    font-size: 18px;

    line-height: 1.7;

}


/* =========================
   НАВИГАЦИЯ
========================= */

.characters-navigation {

    margin-bottom: 30px;

}


.characters-back-link {

    display: inline-block;

    text-decoration: none;

    color: rgba(130, 200, 255, 0.9);

    font-size: 14px;

    letter-spacing: 0.5px;

    padding: 9px 16px;

    border: 1px solid rgba(45, 140, 255, 0.5);

    border-radius: 7px;

    background: rgba(20, 50, 90, 0.35);

    transition:

    background 0.25s ease,

    border-color 0.25s ease,

    box-shadow 0.25s ease;

}


.characters-back-link:hover {

    color: #ffffff;

    background: rgba(30, 90, 160, 0.45);

    border-color: rgba(80, 170, 255, 0.9);

    box-shadow:

    0 0 12px
    rgba(30, 130, 255, 0.25);

}


/* =========================
   ЗАГОЛОВОК
========================= */

#characters-content h1 {

    font-size: 34px;

    margin-bottom: 10px;

    line-height: 1.3;

    text-align: center;


}


/* =========================
   ОПИСАНИЕ БАЗЫ
========================= */

.characters-description {

    font-size: 18px;

    margin-bottom: 35px;

    opacity: 0.85;

    text-align: center;

}


/* =========================
   СЕТКА КАРТОЧЕК
========================= */

.characters-grid {

    display: grid;

    grid-template-columns:
    repeat(3, 1fr);

    gap: 25px;

}


/* =========================
   КАРТОЧКА ПЕРСОНАЖА
========================= */

.character-card {

    display: block;

    text-decoration: none;

    color: inherit;

    background:
    linear-gradient(
        145deg,
        rgba(20, 40, 75, 0.95),
        rgba(8, 18, 38, 0.98)
    );

    border:
    1px solid
    rgba(45, 140, 255, 0.8);

    border-radius: 14px;

    padding: 22px;

    box-shadow:
    0 0 12px
    rgba(30, 120, 255, 0.15),

    inset 0 0 20px
    rgba(20, 100, 200, 0.05);

    transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    border-color 0.25s ease;

    cursor: pointer;

}


/* =========================
   ЭФФЕКТ НАВЕДЕНИЯ
========================= */

.character-card:hover {

    transform:
    translateY(-4px);

    border-color:
    rgba(80, 170, 255, 1);

    box-shadow:
    0 0 20px
    rgba(30, 130, 255, 0.35),

    inset 0 0 25px
    rgba(30, 120, 255, 0.08);

}


/* =========================
   ID
========================= */

.character-id {

    text-align: center;

    font-size: 13px;

    letter-spacing: 2px;

    color:
    rgba(120, 190, 255, 0.9);

    padding-bottom: 12px;

    margin-bottom: 18px;

    border-bottom:
    1px solid
    rgba(70, 150, 240, 0.35);

}


/* =========================
   ОСНОВНАЯ ЧАСТЬ
========================= */

.character-main {

    display: flex;

    gap: 24px;

    align-items: center;

}


/* =========================
   ФОТОГРАФИЯ
========================= */

.character-photo {

    width: 145px;

    height: 185px;

    object-fit: cover;

    flex-shrink: 0;

    border-radius: 8px;

    border:
    1px solid
    rgba(80, 170, 255, 0.6);

    box-shadow:
    0 0 10px
    rgba(30, 120, 255, 0.2);

}


/* =========================
   ИНФОРМАЦИЯ
========================= */

.character-info {

    flex: 1;

    min-width: 0;

}


/* =========================
   ПОДПИСЬ ИМЕНИ
========================= */

.character-name-label {

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color:
    rgba(120, 190, 255, 0.7);

    margin-bottom: 4px;

}


/* =========================
   ИМЯ
========================= */

.character-name {

    font-size: 21px;

    font-weight: 600;

    line-height: 1.3;

    margin-bottom: 18px;

}


/* =========================
   ПОДПИСЬ ДОЛЖНОСТИ
========================= */

.character-position-label {

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color:
    rgba(120, 190, 255, 0.7);

    margin-bottom: 4px;

}


/* =========================
   ДОЛЖНОСТЬ
========================= */

.character-position {

    font-size: 18px;

    font-weight: 500;

    line-height: 1.4;

}


/* =========================
   НИЖНЯЯ ЧАСТЬ
   ПРИНАДЛЕЖНОСТЬ
========================= */

.character-affiliation {

    display: flex;

    align-items: center;

    gap: 15px;

    margin-top: 22px;

    padding-top: 16px;

    border-top:
    1px solid
    rgba(70, 150, 240, 0.35);

}


/* =========================
   ФЛАГ
========================= */

.character-flag {

    width: 52px;

    height: 34px;

    object-fit: cover;

    flex-shrink: 0;

    border-radius: 4px;

    border:
    1px solid
    rgba(100, 180, 255, 0.6);

}


/* =========================
   ПРИНАДЛЕЖНОСТЬ
========================= */

.character-affiliation-name {

    font-size: 16px;

    font-weight: 500;

    line-height: 1.4;

}


/* =========================
   ПОДПИСЬ ПРИНАДЛЕЖНОСТИ
========================= */

.character-affiliation-label {

    display: block;

    font-size: 11px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    color:
    rgba(120, 190, 255, 0.7);

    margin-bottom: 3px;

}


/* =========================
   КНОПКА
========================= */

.character-open {

    text-align: right;

    margin-top: 18px;

    padding-top: 12px;

    border-top:
    1px solid
    rgba(70, 150, 240, 0.2);

    font-size: 12px;

    letter-spacing: 1.5px;

    color:
    rgba(130, 200, 255, 0.8);

}


/* =========================
   АДАПТИВНОСТЬ
========================= */

@media (max-width: 700px) {

    .characters-grid {

        grid-template-columns: 1fr;

    }


    .character-main {

        flex-direction: column;

        align-items: flex-start;

    }


    .character-photo {

        width: 130px;

        height: 165px;

    }

}

</style>

</head>

<body>

<div class="content" id="characters-content">

     НАВИГАЦИЯ
========================= -->

<a
href="../archive.html"
class="characters-back-link"

>

← Вернуться в главный архив

</a>

</div>

<!-- =========================
     ЗАГОЛОВОК
========================= -->

<h1>

База данных персоналий

</h1>

<p class="characters-description">

Центральный архив персонажей и персоналий,
связанных с историей и событиями вселенной.

</p>

<!-- =========================

     Карточки автоматически
     загружаются через characters.js
========================= -->

<div
class="characters-grid"
id="characters-grid"
>

</div>

</div>

     ДАННЫЕ ПЕРСОНАЖЕЙ
========================= -->

========================= -->

</body>

</html>
