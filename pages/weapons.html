<script>

function loadWeaponFile(file) {

fetch(`weapons/${file}`)

.then(response => {

if (!response.ok) {
throw new Error("Ошибка загрузки файла");
}

return response.text();

})

.then(data => {

document.getElementById("weapon-content").innerHTML = data;

})

.catch(error => {

document.getElementById("weapon-content").innerHTML =

"<h1>Ошибка</h1>" +

"<p>Не удалось загрузить данный раздел.</p>";

console.error(error);

});

}

</script>
