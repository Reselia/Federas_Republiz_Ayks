<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Вооружение | Федерация Республик Аякса</title>

<link rel="icon" type="image/x-icon" href="../favicon.ico">

<link rel="stylesheet" href="../style.css">


<style>

/* =========================
   ТИПОГРАФИКА РАЗДЕЛА ОРУЖИЯ
========================= */

#weapons-content {

    font-size: 18px;

    line-height: 1.8;

}


/* Заголовок страницы */

#weapons-content h1 {

    font-size: 34px;

    margin-bottom: 30px;

    line-height: 1.3;

}


/* Основные разделы */

#weapons-content h2 {

    font-size: 26px;

    margin-top: 45px;

    margin-bottom: 20px;

    line-height: 1.4;

}


/* Подразделы */

#weapons-content h3 {

    font-size: 21px;

    margin-top: 30px;

    margin-bottom: 15px;

    line-height: 1.5;

}


/* Текст */

#weapons-content p {

    font-size: 18px;

    line-height: 1.8;

    margin-bottom: 16px;

}


/* Списки */

#weapons-content ul {

    font-size: 18px;

    line-height: 1.8;

    margin-top: 10px;

    margin-bottom: 20px;

    padding-left: 30px;

}


/* Элементы списков */

#weapons-content li {

    margin-bottom: 5px;

}


/* Чтобы длинные слова и названия
не ломали страницу */

#weapons-content {

    overflow-wrap: break-word;

    word-wrap: break-word;

}

</style>

</head>


<body>


<div class="container">


<div class="sidebar">


<h2>🔫 Вооружение</h2>


<a href="../archive.html">
Главная
</a>


<hr>


<a href="#" onclick="loadPage('weapon-concept.html')">
Основная концепция вооружения
</a>


<a href="#" onclick="loadPage('weapon-classification.html')">
Классификация вооружения
</a>


<a href="#" onclick="loadPage('fleet-classification.html')">
Флот и корабли ФРА
</a>


<a href="#" onclick="loadPage('orbital-systems.html')">
Орбитальные системы ФРА
</a>


</div>


<div class="content" id="weapons-content">


</div>


</div>


<script>


function loadPage(page){


fetch("weapons/" + page)


.then(response => {


if(!response.ok){

throw new Error("Ошибка загрузки");

}


return response.text();


})


.then(data => {


document.getElementById("weapons-content").innerHTML = data;


let titles = {


"weapon-concept.html":
"Вооружение | Основная концепция",


"weapon-classification.html":
"Вооружение | Классификация вооружения",


"fleet-classification.html":
"Вооружение | Флот и корабли ФРА",


"orbital-systems.html":
"Вооружение | Орбитальные системы ФРА"


};


document.title =
titles[page] ||
"Вооружение | Федерация Республик Аякса";


})


.catch(error => {


document.getElementById("weapons-content").innerHTML =

"<h2>Ошибка загрузки данных</h2>";


});


}


loadPage("weapon-concept.html");


</script>


</body>

</html>
