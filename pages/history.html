<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>История | Федерация Республик Аякса</title>

<link rel="icon" type="image/x-icon" href="../favicon.ico">

<link rel="stylesheet" href="../style.css">


<style>

/* =========================
   ТИПОГРАФИКА РАЗДЕЛА ИСТОРИИ
========================= */

#history-content {

    font-size: 18px;

    line-height: 1.8;

    overflow-wrap: break-word;

    word-wrap: break-word;

}


/* Заголовок страницы */

#history-content h1 {

    font-size: 34px;

    margin-bottom: 30px;

    line-height: 1.3;

}


/* Основные разделы */

#history-content h2 {

    font-size: 26px;

    margin-top: 45px;

    margin-bottom: 20px;

    line-height: 1.4;

}


/* Подразделы */

#history-content h3 {

    font-size: 21px;

    margin-top: 30px;

    margin-bottom: 15px;

    line-height: 1.5;

}


/* Текст */

#history-content p {

    font-size: 18px;

    line-height: 1.8;

    margin-bottom: 16px;

}


/* Списки */

#history-content ul {

    font-size: 18px;

    line-height: 1.8;

    margin-top: 10px;

    margin-bottom: 20px;

    padding-left: 30px;

}


/* Элементы списков */

#history-content li {

    margin-bottom: 5px;

}

</style>

</head>


<body>


<div class="container">


<div class="sidebar">


<h2>
📖 История
</h2>


<a href="../archive.html">
Главная
</a>


<hr>


<a href="#" onclick="loadPage('federation-history.html')">
История Федерации
</a>


<a href="#" onclick="loadPage('aia-history.html')">
История А.И.Я
</a>


</div>


<div class="content" id="history-content">


</div>


</div>



<script>


function loadPage(page) {


fetch("history/" + page)


.then(response => {


if (!response.ok) {

throw new Error("Ошибка загрузки");

}


return response.text();


})


.then(data => {


document.getElementById("history-content").innerHTML = data;



let titles = {


"federation-history.html":
"История | История Федерации",


"aia-history.html":
"История | История А.И.Я"


};



document.title =
titles[page] ||
"История | Федерация Республик Аякса";


})


.catch(error => {


document.getElementById("history-content").innerHTML =

"<h2>Ошибка загрузки данных</h2>";


});


}


loadPage("federation-history.html");


</script>


</body>

</html>
